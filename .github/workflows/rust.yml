name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add github:cachix/devenv/2418e1b43797c44de5166176622c8d8fa0149871#devenv

      - name: Run the pinned development environment gate
        run: devenv --no-tui test

      # `cargo package` is intentionally not part of push/PR CI because the
      # project currently depends on the git-only `r7z` crate and is not
      # treated as a crates.io-publishable artifact yet.
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add github:cachix/devenv/2418e1b43797c44de5166176622c8d8fa0149871#devenv

      - name: Audit dependencies
        run: devenv --profile maintenance shell -- cargo audit

      - name: Check dependency policy
        run: devenv --profile maintenance shell -- cargo deny check
