name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add github:cachix/devenv/2418e1b43797c44de5166176622c8d8fa0149871#devenv

      - name: Run the pinned development environment gate
        run: devenv --no-tui test

      # `cargo package` is intentionally not part of push/PR CI because the
      # project currently depends on the git-only `r7z` crate and is not
      # treated as a crates.io-publishable artifact yet.
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            cmake \
            libarchive-dev \
            liblz4-dev \
            libsqlite3-dev \
            pkg-config \
            zlib1g-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maintenance tools
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny check
